# worker-talos-vm
apiVersion: v1alpha1
kind: SysctlConfig
params:
  vm.nr_hugepages: "1024"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvme_tcp
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_pci
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.14.1
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: true
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  useNTS: false
  servers: [time.cloudflare.com]
version: v1alpha1
---
machine:
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options: [bind, rshared, rw]
  network:
    interfaces:
      - interface: ens18
        dhcp: false
        addresses: [10.22.20.23/24]
        routes:
          - network: 0.0.0.0/0
            gateway: 10.22.20.1
    nameservers: [10.22.20.1]
