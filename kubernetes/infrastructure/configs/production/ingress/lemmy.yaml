apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lemmy
  namespace: lemmy
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/use-regex: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Decentralized Discussion Platform
    gethomepage.dev/group: Social & Reading
    gethomepage.dev/icon: lemmy.svg
    gethomepage.dev/name: Lemmy
    gethomepage.dev/siteMonitor: https://lemmy.bunga.kroseu.com
    gethomepage.dev/weight: "10"
    # selects all pods in the namespace
    gethomepage.dev/pod-selector: ""
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lemmy.bunga.kryoseu.com
      secretName: lemmy-tls

  rules:
    - host: lemmy.bunga.kryoseu.com
      http:
        paths:
          # Lemmy backend
          - path: /(api|pictrs|feeds|nodeinfo|.well-known)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lemmy
                port:
                  number: 8536

          # UI
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lemmy-ui
                port:
                  number: 1234
