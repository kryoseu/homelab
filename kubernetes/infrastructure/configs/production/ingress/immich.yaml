apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: home-apps
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Photo and Video Manager
    gethomepage.dev/group: Media
    gethomepage.dev/icon: immich.svg
    gethomepage.dev/name: immich
    gethomepage.dev/siteMonitor: http://immich-server.home-apps.svc.cluster.local:2283
    gethomepage.dev/weight: "20"
    gethomepage.dev/widget.type: immich
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance in (immich,immich-postgres)"
    gethomepage.dev/widget.url: http://immich-server.home-apps.svc.cluster.local:2283
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - immich.kryoseu.com
      secretName: immich-tls
  rules:
    - host: "immich.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
