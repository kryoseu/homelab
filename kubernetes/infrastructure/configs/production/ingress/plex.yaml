apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-server
  namespace: plex-ns
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-redirect-to: /
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Plex Media Server
    gethomepage.dev/group: Media
    gethomepage.dev/icon: plex.svg
    gethomepage.dev/name: Plex
    gethomepage.dev/siteMonitor: http://plex.plex-ns.svc.cluster.local:32400
    gethomepage.dev/weight: "10"
    gethomepage.dev/widget.type: plex
    gethomepage.dev/widget.url: http://plex.plex-ns.svc.cluster.local:32400
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_AUTH_TOKEN}}"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - plex.kryoseu.com
      secretName: plex-tls
  rules:
    - host: "plex.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: plex
                port:
                  number: 32400
