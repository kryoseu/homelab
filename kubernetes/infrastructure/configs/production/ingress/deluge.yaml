apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deluge
  namespace: plex-ns
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Torrent Client
    gethomepage.dev/group: Downloads
    gethomepage.dev/icon: deluge.svg
    gethomepage.dev/name: deluge-vpn
    gethomepage.dev/siteMonitor: http://deluge.plex-ns.svc.cluster.local:8112
    gethomepage.dev/weight: "40"
    gethomepage.dev/widget.type: deluge
    gethomepage.dev/widget.url: http://deluge.plex-ns.svc.cluster.local:8112
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_DELUGE_PASSWORD}}"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - deluge.kryoseu.com
      secretName: deluge-tls
  rules:
    - host: "deluge.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: deluge
                port:
                  number: 8112
