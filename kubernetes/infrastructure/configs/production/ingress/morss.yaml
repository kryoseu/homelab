apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: morss
  namespace: wyrm
  labels:
    app.kubernetes.io/name: morss
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - morss.kryoseu.com
      secretName: morss-tls
  rules:
    - host: "morss.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: morss
                port:
                  number: 8000
