apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: plex-ns
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Series Manager
    gethomepage.dev/group: Downloads
    gethomepage.dev/icon: sonarr.svg
    gethomepage.dev/name: sonarr
    gethomepage.dev/siteMonitor: http://sonarr.plex-ns.svc.cluster.local:8989
    gethomepage.dev/weight: "20"
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.plex-ns.svc.cluster.local:8989
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - sonarr.kryoseu.com
      secretName: sonarr-tls
  rules:
    - host: "sonarr.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
