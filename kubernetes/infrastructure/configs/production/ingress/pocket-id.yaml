apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
  namespace: pocket-id
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Identity Provider
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: pocket-id.svg
    gethomepage.dev/name: Pocket ID
    gethomepage.dev/siteMonitor: https://id.kryoseu.com
    gethomepage.dev/weight: "30"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - id.kryoseu.com
      secretName: pocket-id-tls
  rules:
    - host: "id.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  number: 1411
