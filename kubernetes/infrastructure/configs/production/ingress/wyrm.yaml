apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: RSS Reader
    gethomepage.dev/group: Social & Reading
    gethomepage.dev/icon: https://raw.githubusercontent.com/kryoseu/WyrmRSS/refs/heads/main/web/public/favicon.svg
    gethomepage.dev/name: WyrmRSS
    gethomepage.dev/siteMonitor: https://wyrm-ui.wyrm.svc.cluter.local:3000
    gethomepage.dev/weight: "20"
    # selects all pods in the namespace
    gethomepage.dev/pod-selector: ""
  name: wyrm
  namespace: wyrm
spec:
  ingressClassName: "nginx"
  rules:
    - host: wyrm.kryoseu.com
      http:
        paths:
          - backend:
              service:
                name: wyrm-ui
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - wyrm.kryoseu.com
      secretName: wyrm-ui-tls
