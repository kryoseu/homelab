apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Document Management
    gethomepage.dev/group: Productivity
    gethomepage.dev/icon: paperless.png
    gethomepage.dev/name: Paperless-ngx
    gethomepage.dev/siteMonitor: https://paperless.kryoseu.com
    gethomepage.dev/weight: "10"
    # selects all pods in the namespace
    gethomepage.dev/pod-selector: ""
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - paperless.kryoseu.com
      secretName: paperless-tls
  rules:
    - host: "paperless.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: paperless-ngx
                port:
                  number: 8000
