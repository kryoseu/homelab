apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: plex-ns
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Movie Manager
    gethomepage.dev/group: Media
    gethomepage.dev/icon: radarr.svg
    gethomepage.dev/name: radarr
    gethomepage.dev/siteMonitor: http://radarr.plex-ns.svc.cluster.local:7878
    gethomepage.dev/weight: "10"
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr.plex-ns.svc.cluster.local:7878
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - radarr.kryoseu.com
      secretName: radarr-tls
  rules:
    - host: "radarr.kryoseu.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
