apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-tokens
  namespace: plex-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: plex-tokens
  data:
    - secretKey: PLEX_CLAIM
      remoteRef:
        key: apps
        property: PLEX_CLAIM
    - secretKey: PLEX_AUTH_TOKEN
      remoteRef:
        key: apps
        property: PLEX_AUTH_TOKEN
