apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-webpassword
  namespace: home-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: pihole-webpassword
  data:
    - secretKey: password
      remoteRef:
        key: apps
        property: PIHOLE_PASSWORD
