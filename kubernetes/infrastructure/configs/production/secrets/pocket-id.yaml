apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: pocket-id
  data:
    - secretKey: username
      remoteRef:
        key: apps
        property: POCKET_ID_DB_USERNAME
    - secretKey: password
      remoteRef:
        key: apps
        property: POCKET_ID_DB_PASSWORD
    - secretKey: DB_CONNECTION_STRING
      remoteRef:
        key: apps
        property: POCKET_ID_DATABASE_CONNECTION
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: apps
        property: POCKET_ID_ENCRYPTION_KEY
