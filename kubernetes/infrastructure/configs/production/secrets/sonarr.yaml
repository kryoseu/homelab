apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-api-key
  namespace: plex-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: sonarr-api-key
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: apps
        property: SONARR_API_KEY
