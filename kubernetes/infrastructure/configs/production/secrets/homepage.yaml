apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: homepage-env
  data:
    - secretKey: HOMEPAGE_VAR_PIHOLE_KEY
      remoteRef:
        key: apps
        property: PIHOLE_PASSWORD
