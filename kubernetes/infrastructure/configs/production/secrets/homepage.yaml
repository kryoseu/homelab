apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: homepage-env
  data:
    - secretKey: HOMEPAGE_VAR_PIHOLE_KEY
      remoteRef:
        key: apps
        property: PIHOLE_PASSWORD
    - secretKey: HOMEPAGE_VAR_PLEX_AUTH_TOKEN
      remoteRef:
        key: apps
        property: PLEX_AUTH_TOKEN
    - secretKey: HOMEPAGE_VAR_IMMICH_API_KEY
      remoteRef:
        key: apps
        property: IMMICH_API_KEY
    - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
      remoteRef:
        key: apps
        property: RADARR_API_KEY
    - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
      remoteRef:
        key: apps
        property: SONARR_API_KEY
    - secretKey: HOMEPAGE_VAR_PROWLARR_API_KEY
      remoteRef:
        key: apps
        property: PROWLARR_API_KEY
