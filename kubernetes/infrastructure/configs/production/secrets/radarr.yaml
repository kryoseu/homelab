apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-api-key
  namespace: plex-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-kv-store
    kind: ClusterSecretStore
  target:
    name: radarr-api-key
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: apps
        property: RADARR_API_KEY
