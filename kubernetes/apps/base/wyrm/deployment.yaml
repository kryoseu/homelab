apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyrm-server
  namespace: wyrm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wyrm-server
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wyrm-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: wyrm-server
          image: ghcr.io/wyrmrss/wyrm-server:0.40.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
          env:
            - name: WYRM_DATABASE_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: wyrm-creds
                  key: WYRM_DATABASE_CONNECTION
            - name: WYRM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wyrm-creds
                  key: WYRM_API_KEY
            - name: WYRM_PUBLIC_URL
              value: https://wyrm.kryoseu.com
            - name: WYRM_OIDC_ISSUER_URL
              value: https://id.kryoseu.com
            - name: WYRM_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wyrm-creds
                  key: WYRM_OIDC_CLIENT_ID
            - name: WYRM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wyrm-creds
                  key: WYRM_OIDC_CLIENT_SECRET
            - name: WYRM_OIDC_ALLOWED_SUBJECTS
              valueFrom:
                secretKeyRef:
                  name: wyrm-creds
                  key: WYRM_OIDC_ALLOWED_SUBJECTS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyrm-ui
  namespace: wyrm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wyrm-ui
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wyrm-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: wyrm-ui
          image: ghcr.io/wyrmrss/wyrm-ui:0.39.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          ports:
            - containerPort: 3000
          env:
            - name: WYRM_BACKEND_URL
              value: "http://wyrm-server:3001"
      volumes:
        - name: nginx-conf
          emptyDir: {}
