apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: home-apps
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system

  values:
    controllers:
      main:
        containers:
          main:
            env:
              REDIS_HOSTNAME: immich-valkey.home-apps.svc.cluster.local
              DB_HOSTNAME: immich-postgres-rw.home-apps.svc.cluster.local
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: password
              DB_DATABASE_NAME: immich
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library-encrypted
      configuration: {}

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
                pullPolicy: IfNotPresent
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: longhorn

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
                pullPolicy: IfNotPresent
              env:
                # TODO: remove after 3.4.3 (immich#33466)
                IMMICH_HOST: "0.0.0.0"

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
      persistence:
        cache:
          enabled: true
          sizeLimit: 10Gi
          type: emptyDir
