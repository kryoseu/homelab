apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: home-apps
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 0.13.2
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system

  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.2
            env:
              REDIS_HOSTNAME: immich-valkey.home-apps.svc.cluster.local
              DB_HOSTNAME: immich-postgres-rw.home-apps.svc.cluster.local
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-creds
                    key: password
              DB_DATABASE_NAME: immich
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library-encrypted
      configuration: {}

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.2-alpine@sha256:43135a13c2d480c6d99d765119098fe617483b6d03fb9996dd89f7a980f143a5
                pullPolicy: IfNotPresent
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: longhorn

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteMany
          storageClass: longhorn
