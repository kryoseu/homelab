apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.2@sha256:649da2df5f079dd1f214e3a877cafd0208eff3779e9c60d14d243fbca5e11c97
  imagePullPolicy: IfNotPresent

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

  inheritedMetadata:
    labels:
      app: immich-database
      policy-type: "database"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup
        serverName: immich-postgres-v2

  storage:
    size: 5Gi
    storageClass: longhorn-single

  managed:
    roles:
      - name: immich
        superuser: true
        login: true

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-backup
          serverName: immich-postgres

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich

  # For a future restore: swap initdb for this, and bump the
  # plugins serverName above to immich-postgres-v3
  # externalClusters:
  #   - name: clusterBackup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: immich-backup
  #         serverName: immich-postgres-v2
  # bootstrap:
  #   recovery:
  #     source: clusterBackup
  #     database: immich
  #     owner: immich
  #     secret:
  #       name: immich
