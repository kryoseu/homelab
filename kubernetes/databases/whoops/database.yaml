apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whoops-postgres
  namespace: whoops
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  imagePullPolicy: Always

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: whoops-backup

  storage:
    size: 3Gi

  externalClusters:
    - name: clusterBackup
      barmanObjectStore:
        destinationPath: "s3://kryoseu-whoops/postgres"
        serverName: "whoops-postgres"
        s3Credentials:
          accessKeyId:
            name: aws-creds-envs
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: aws-creds-envs
            key: ACCESS_SECRET_KEY

  bootstrap:
    recovery:
      source: clusterBackup
      database: whoop_data
      owner: whoops
      secret:
        name: whoops-creds

  # (optional) For development
  # managed:
  #   services:
  #     additional:
  #       - selectorType: ro
  #         serviceTemplate:
  #           metadata:
  #             name: "whoop-db"
  #           spec:
  #             type: LoadBalancer
