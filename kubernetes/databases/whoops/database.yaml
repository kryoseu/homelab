apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whoops-postgres
  namespace: whoops
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"

spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: whoops-backup
        serverName: whoops-postgres-v2

  storage:
    size: 3Gi

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: whoops-backup
          serverName: whoops-postgres

  bootstrap:
    recovery:
      source: clusterBackup
      database: whoop_data
      owner: whoops
      secret:
        name: whoops-creds

  # (optional) For development
  # managed:
  #   services:
  #     additional:
  #       - selectorType: ro
  #         serviceTemplate:
  #           metadata:
  #             name: "whoop-db"
  #           spec:
  #             type: LoadBalancer
