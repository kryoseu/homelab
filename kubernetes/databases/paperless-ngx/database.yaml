apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgres
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperless-ngx-backup
        serverName: paperless-postgres-v2

  storage:
    size: 10Gi
    storageClass: longhorn-single

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: paperless-ngx-backup
          serverName: paperless-ngx-postgres

  bootstrap:
    initdb:
      database: paperless_ngx
      owner: paperless
      secret:
        name: paperless-ngx-creds

  # For a future restore: swap initdb for this, and bump the
  # plugins serverName above to paperless-ngx-postgres-v3.
  # externalClusters:
  #   - name: clusterBackup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: paperless-ngx-backup
  #         serverName: paperless-ngx-postgres-v2
  # bootstrap:
  #   recovery:
  #     source: clusterBackup
  #     database: paperless_ngx
  #     owner: paperless_ngx
