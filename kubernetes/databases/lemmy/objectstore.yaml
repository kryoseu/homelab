apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lemmy-backup
  namespace: lemmy
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://kryoseu-lemmy/postgres
    endpointURL: https://s3.us-west-2.amazonaws.com/
    s3Credentials:
      accessKeyId:
        name: aws-creds-envs
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: aws-creds-envs
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
