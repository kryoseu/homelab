apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lemmy-postgres
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lemmy-backup
        serverName: lemmy-postgres-v2

  storage:
    size: 30Gi

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: lemmy-backup
          serverName: lemmy-postgres

  bootstrap:
    recovery:
      source: clusterBackup
      database: lemmy
      owner: lemmy
      secret:
        name: lemmy-creds

  # bootstrap:
  #   initdb:
  #     database: lemmy
  #     owner: lemmy
  #     secret:
  #       name: lemmy-creds
