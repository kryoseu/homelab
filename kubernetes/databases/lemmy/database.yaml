apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lemmy-postgres
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lemmy-backup
        serverName: lemmy-postgres-v2

  storage:
    size: 30Gi
    storageClass: longhorn-single

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: lemmy-backup
          serverName: lemmy-postgres

  bootstrap:
    initdb:
      database: lemmy
      owner: lemmy
      secret:
        name: lemmy-creds

  # For a future restore: swap initdb for this, and bump the
  # plugins serverName above to lemmy-postgres-v3.
  # externalClusters:
  #   - name: clusterBackup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: paperless-ngx-backup
  #         serverName: lemmy-postgres-v2
  # bootstrap:
  #   recovery:
  #     source: clusterBackup
  #     database: lemmy
  #     owner: lemmy
  #     secret:
  #       name: lemmy-creds
