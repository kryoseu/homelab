apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wyrm-postgres
  namespace: wyrm
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: wyrm-backup
        serverName: wyrm-postgres-v3

  storage:
    size: 5Gi
    storageClass: longhorn-single

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: wyrm-backup
          serverName: wyrm-postgres-v2

  bootstrap:
    recovery:
      source: clusterBackup
      database: wyrm
      owner: wyrm
      secret:
        name: wyrm-creds

  # For a future restore: swap initdb for this, and bump the
  # plugins serverName above to pocket-id-postgres-v4.
  # externalClusters:
  #   - name: clusterBackup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: wyrm-backup
  #         serverName: wyrm-postgres-v3
