apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wyrm-postgres
  namespace: wyrm
  # annotations:
  #   cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  imagePullPolicy: IfNotPresent

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: wyrm-backup
        serverName: wyrm-postgres-v2

  storage:
    size: 10Gi

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: wyrm-backup
          serverName: wyrm-postgres

  bootstrap:
    recovery:
      source: clusterBackup
      database: wyrm
      owner: wyrm
      secret:
        name: wyrm-creds

  # bootstrap:
  #   initdb:
  #     database: wyrm
  #     owner: wyrm
  #     secret:
  #       name: wyrm-creds
