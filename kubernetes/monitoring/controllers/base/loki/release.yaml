apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "18.11.7"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 12h
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 720h
        max_label_names_per_series: 20
      storage:
        type: "filesystem"
        bucketNames:
          chunks: dummy
          ruler: dummy
          admin: dummy
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            index:
              prefix: loki_index_
              period: 24h
            object_store: filesystem
            schema: v13
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
    read:
      replicas: 0
    backend:
      replicas: 0
    write:
      replicas: 0
